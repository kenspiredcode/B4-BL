name: Release smoke

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test tools
        run: python -m pip install '.[decode]' pytest build
      - name: Check installed CLI and deterministic fixtures
        run: |
          b4bl --help
          b4bl encode --help
          b4bl decode --help
          b4bl listen --help
          python -m pytest tests/test_release_api.py tests/test_protocol.py tests/test_runtime_receiver.py -q
          python tools_verify_port.py
      - name: Build wheel and source distribution
        run: python -m build
      - name: Verify source distribution and wheel exist
        run: |
          test -n "$(find dist -maxdepth 1 -name 'b4bl-*.whl' -print -quit)"
          test -n "$(find dist -maxdepth 1 -name 'b4bl-*.tar.gz' -print -quit)"
